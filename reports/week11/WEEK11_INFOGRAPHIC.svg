<text x="465" y="425" class="body">9 label-blind candidates · 3 per prediction state</text>
<text x="465" y="458" class="body">First four-arm retrieval executed · 15 policy records</text>
<text x="1195" y="355" class="head">20% remaining</text>
<text x="1195" y="397" class="body">Query quality</text>
<text x="1195" y="427" class="body">Human labels</text>
<text x="1195" y="457" class="body">Final evaluation</text>
