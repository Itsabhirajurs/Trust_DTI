<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">TrustDTI Week 11 interim progress — 22 November 2026</title>
<desc id="desc">An 80 percent weighted project-management progress estimate. Network 2 validation and nine-candidate generation are complete. Initial literature retrieval executed but quality is unresolved. Human annotation and matched-policy evaluation remain pending.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a31"/><stop offset="1" stop-color="#103e58"/></linearGradient>
  <style>
    .eyebrow{font:700 16px Arial;fill:#58d9e8;letter-spacing:2px}
    .title{font:700 46px Arial;fill:#f3faff}
    .sub{font:20px Arial;fill:#b8d2e2}
    .big{font:700 108px Arial;fill:#ffffff}
    .head{font:700 24px Arial;fill:#f3faff}
    .body{font:18px Arial;fill:#c0d7e4}
    .small{font:15px Arial;fill:#9fc0d2}
    .num{font:700 22px Arial;fill:#ffffff}
    .green{fill:#68e0b4}
    .amber{fill:#f4c66f}
    .red{fill:#f28a88}
  </style>
</defs>
<rect width="1600" height="1180" fill="url(#bg)"/>
