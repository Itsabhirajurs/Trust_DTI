<circle cx="1094" cy="617" r="13" fill="#176092"/><text x="1094" y="623" text-anchor="middle" font-size="16" font-weight="800" fill="white">2</text><text x="1120" y="623" class="body">Re-run notebook from a clean runtime</text>
<circle cx="1094" cy="650" r="13" fill="#176092"/><text x="1094" y="656" text-anchor="middle" font-size="16" font-weight="800" fill="white">3</text><text x="1120" y="656" class="body">Build a labelled DTI baseline</text>
<circle cx="1094" cy="683" r="13" fill="#176092"/><text x="1094" y="689" text-anchor="middle" font-size="16" font-weight="800" fill="white">4</text><text x="1120" y="689" class="body">Evaluate with leakage-aware splits</text>

<rect x="28" y="740" width="1544" height="222" rx="16" fill="#e8eff7" stroke="#cad6e4" stroke-width="2"/>
<text x="55" y="783" class="h">Important research boundary</text>
<text x="55" y="821" class="body">This was a smoke test on 100 compounds and 20 proteins. It does not establish binding accuracy, calibrated uncertainty, conformal coverage, or improved evidence retrieval.</text>
<text x="55" y="855" class="body">Full-dataset embedding generation, labelled drug–target model training, predictive evaluation, uncertainty calibration, and adaptive retrieval are still pending.</text>
<text x="55" y="913" class="muted">TrustDTI · Week 7 course progress · Model IDs, timings, shapes, and validation counts documented in WEEK07_PROGRESS_REPORT.md</text>
<text x="1543" y="913" text-anchor="end" class="muted">Research status: pilot complete, baseline not started</text>
